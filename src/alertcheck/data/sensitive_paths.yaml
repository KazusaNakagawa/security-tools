# http.exposure の検査対象パス（設計書 7.3）
# path は対象 URL からの相対パス（先頭に / を付けない）。
# category ごとに重大度・IPA 項目・HTML の扱いを決める（http_exposure.py の CATEGORIES）。
# match は内容の検証ルール。1 つ以上を指定し、すべて満たしたときだけ検出とする。
#   any: [..]      本文にいずれかの文字列を含む
#   regex: ".."    本文が正規表現に一致する（複数行・大文字小文字を区別しない）
#   magic: [..]    本文の先頭が 16 進で指定したバイト列のいずれかで始まる
#   env: true      dotenv 形式（KEY=VALUE の行が中心）
#   json_keys: [..] JSON オブジェクトで、いずれかのキーを持つ
#   login_form: true  パスワード入力欄を持つ HTML（401 + WWW-Authenticate も検出）
# severity を書くとカテゴリの既定値を上書きする。

# --- バージョン管理のメタデータ ---
- {path: .git/HEAD, category: vcs, match: {regex: '\A\s*(ref: refs/|[0-9a-f]{40}\s*\Z)'}}
- {path: .git/config, category: vcs, match: {any: ["[core]"]}}
- {path: .git/index, category: vcs, match: {magic: ["44495243"]}}
- {path: .git/logs/HEAD, category: vcs, match: {regex: '^[0-9a-f]{40} [0-9a-f]{40} '}}
- {path: .gitignore, category: manifest, severity: info, match: {regex: '^[\w.*/!#-]'}}
- {path: .svn/entries, category: vcs, match: {regex: '\A(\d+\s*$|<\?xml)'}}
- {path: .svn/wc.db, category: vcs, match: {magic: ["53514c69746520666f726d6174203300"]}}
- {path: .hg/hgrc, category: vcs, match: {any: ["[paths]", "[ui]"]}}
- {path: .bzr/README, category: vcs, match: {any: ["Bazaar"]}}
- {path: CVS/Root, category: vcs, match: {regex: '^:(pserver|ext):'}}

