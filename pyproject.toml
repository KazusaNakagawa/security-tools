[project]
name = "alertcheck"
version = "0.1.0"
description = "Local checker for the IPA alert on unauthorized access and data leaks (2026-10-09)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "sslyze>=6.1",
]

[project.scripts]
alertcheck = "alertcheck.cli:app"

[project.entry-points."alertcheck.checks"]
tls = "alertcheck.checks.network.tls:TlsCheck"
"http.headers" = "alertcheck.checks.network.http_headers:HttpHeadersCheck"
"http.cookies" = "alertcheck.checks.network.http_cookies:HttpCookiesCheck"
"http.exposure" = "alertcheck.checks.network.http_exposure:HttpExposureCheck"
"http.errors" = "alertcheck.checks.network.http_errors:HttpErrorsCheck"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alertcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# user-facing Japanese messages read better unsplit
"src/alertcheck/checks/**" = ["E501"]
